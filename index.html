<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; background: #667eea; color: white; padding: 20px; padding-bottom: 80px; margin: 0; }
        .card { background: rgba(255,255,255,0.2); padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        h3 { margin-top: 0; margin-bottom: 5px; }
        p { margin-top: 0; margin-bottom: 10px; font-weight: bold; color: #ffd700; }
        select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; font-size: 16px; }
        button { background: #ff6b6b; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Вкладки (Табы) */
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { flex: 1; background: rgba(255,255,255,0.1); color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .tab-btn.active { background: #ffd700; color: #333; font-weight: bold; }
        
        /* Кнопки складов */
        .store-btn { display: block; background: #ff6b6b; color: white; text-align: center; padding: 10px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: bold; margin-bottom: 5px;}
        .store-btn:hover { background: #ff5252; }
        
        #checkout-btn {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #28a745;
            color: white; padding: 20px; font-size: 18px; border: none;
            display: none; font-weight: bold; text-align: center; box-sizing: border-box; cursor: pointer;
            z-index: 100;
        }

        dialog { border: none; border-radius: 12px; padding: 20px; background: #fff; color: #333; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 80vh; overflow-y: auto; }
        dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
        dialog h3 { margin-top: 0; color: #333; }
        dialog select { border: 1px solid #ccc; background: #f9f9f9; color: #333; margin-top: 10px; }
        dialog button { background: #28a745; margin-top: 10px; }
        dialog .cancel-btn { background: #ccc; color: #333; margin-top: 5px; }
    </style>
</head>
<body>
    <h2>Магазин</h2>

    <!-- Вкладки выбора объема -->
    <div class="tabs">
        <button class="tab-btn active" onclick="changeTab('10')">от 10 шт</button>
        <button class="tab-btn" onclick="changeTab('30')">от 30 шт</button>
        <button class="tab-btn" onclick="changeTab('50')">от 50 шт</button>
        <button class="tab-btn" onclick="changeTab('100')">от 100 шт</button>
    </div>

    <!-- Блок с товарами (он будет меняться при нажатии на вкладки) -->
    <div id="product-container">
        <!-- Сюда скрипт будет вставлять карточки -->
    </div>

    <!-- Плавающая кнопка заказа -->
    <button id="checkout-btn" onclick="openMetroModal()">🛒 Оформить заказ</button>

    <!-- Всплывающее окно выбора метро -->
    <dialog id="metro-dialog">
        <h3>🚇 Выберите станцию метро</h3>
        <p style="font-size: 14px; color: #666;">Доставка по Минску</p>
        <select id="metro-station">
            <option value="" disabled selected>--- Выберите станцию ---</option>
            <optgroup label="🔴 Красная линия">
                <option value="Малиновка">Малиновка</option>
                <option value="Петровщина">Петровщина</option>
                <option value="Михалово">Михалово</option>
                <option value="Грушевка">Грушевка</option>
                <option value="Институт культуры">Институт культуры</option>
                <option value="Площадь Ленина">Площадь Ленина</option>
                <option value="Октябрьская">Октябрьская</option>
                <option value="Площадь Победы">Площадь Победы</option>
                <option value="Площадь Якуба Коласа">Площадь Якуба Коласа</option>
                <option value="Академия наук">Академия наук</option>
                <option value="Парк Челюскинцев">Парк Челюскинцев</option>
                <option value="Московская">Московская</option>
                <option value="Восток">Восток</option>
                <option value="Борисовский тракт">Борисовский тракт</option>
                <option value="Уручье">Уручье</option>
            </optgroup>
            <optgroup label="🔵 Синяя линия">
                <option value="Каменная Горка">Каменная Горка</option>
                <option value="Кунцевщина">Кунцевщина</option>
                <option value="Спортивная">Спортивная</option>
                <option value="Пушкинская">Пушкинская</option>
                <option value="Молодёжная">Молодёжная</option>
                <option value="Фрунзенская">Фрунзенская</option>
                <option value="Немига">Немига</option>
                <option value="Купаловская">Купаловская</option>
                <option value="Первомайская">Первомайская</option>
                <option value="Пролетарская">Пролетарская</option>
                <option value="Тракторный завод">Тракторный завод</option>
                <option value="Партизанская">Партизанская</option>
                <option value="Автозаводская">Автозаводская</option>
                <option value="Могилёвская">Могилёвская</option>
            </optgroup>
        </select>
        <button onclick="confirmCheckout()">Подтвердить заказ</button>
        <button class="cancel-btn" onclick="closeMetroModal()">Отмена</button>
    </dialog>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        let cart = [];
        let currentTab = '10'; // По умолчанию открыта вкладка "от 10 шт"

        // === НАСТРОЙКИ ТОВАРОВ И ЦЕН ===
        // Здесь ты можешь менять цены для каждого объема
        const PRICES = {
            '10': 15,  // Цена при заказе от 10 шт
            '30': 14,  // Цена при заказе от 30 шт
            '50': 13,  // Цена при заказе от 50 шт
            '100': 12  // Цена при заказе от 100 шт
        };

        // Вкусы (остаются одинаковыми для всех вкладок)
        const catswillFlavors = [
            "Яблоко", "Груша", "Клубника", "Персик", "Виноград", "Арбуз", "Дыня", "Манго", 
            "Ананас", "Вишня", "Малина", "Черника", "Голубика", "Киви", "Маракуйя", "Гранат", 
            "Лайм", "Банан", "Кокос", "Мята", "Ментол", "Мятный лимонад", "Мохито", "Кола", 
            "Энергетик", "Табак", "Кофе", "Шоколад", "Карамель", "Ваниль", "Йогурт", "Крем-сода"
        ];

        // Функция переключения вкладок
        function changeTab(tab) {
            currentTab = tab;
            
            // Меняем активную кнопку
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Перерисовываем товары
            renderProducts();
        }

        // Функция отрисовки товаров
        function renderProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = ''; // Очищаем старое

            const currentPrice = PRICES[currentTab];

            // Создаем карточку Catswill
            let options = catswillFlavors.map(f => `<option value="${f}">${f}</option>`).join('');

            container.innerHTML = `
                <div class="card">
                    <h3>🐱 Catswill (Опт)</h3>
                    <p>Цена за 1 шт: ${currentPrice} руб.</p>
                    <select id="catswill-flavor">
                        <option value="" disabled selected>--- Выберите вкус ---</option>
                        ${options}
                    </select>
                    <button onclick="addToCart('Catswill', ${currentPrice}, 'catswill-flavor')">➕ В корзину</button>
                </div>
            `;
        }

        // Добавление в корзину
        function addToCart(name, price, selectId) {
            const selectElement = document.getElementById(selectId);
            if (!selectElement.value) {
                alert("⚠️ Пожалуйста, выберите вкус!");
                return;
            }

            let finalName = name + " [" + selectElement.value + "]";
            cart.push({ name: finalName, price: price });
            updateCheckoutBtn();
            alert("Товар добавлен в корзину!");
        }

        function updateCheckoutBtn() {
            const btn = document.getElementById('checkout-btn');
            if (cart.length > 0) {
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                btn.style.display = 'block';
                btn.innerText = `🛒 Оформить заказ (${cart.length} шт.) на ${total} руб.`;
            } else {
                btn.style.display = 'none';
            }
        }

        function openMetroModal() {
            if (cart.length === 0) return;
            document.getElementById('metro-dialog').showModal();
        }

        function closeMetroModal() {
            document.getElementById('metro-dialog').close();
        }

        function confirmCheckout() {
            const metroSelect = document.getElementById('metro-station');
            const selectedMetro = metroSelect.value;

            if (!selectedMetro) {
                alert("⚠️ Пожалуйста, выберите станцию метро!");
                return;
            }

            closeMetroModal();
            sendOrder(selectedMetro);
        }

        function sendOrder(metroStation) {
            var token = "8270338103:AAFx1KSB85vrwTyACfbIonpTHa4h0pXn-FA";
            var adminId = "5569005187";
            
            var user = window.Telegram.WebApp.initDataUnsafe ? window.Telegram.WebApp.initDataUnsafe.user : null;
            var clientName = user ? (user.username ? "@" + user.username : user.first_name) : "Неизвестный";
            var clientId = user ? user.id : "Нет ID";

            let itemsText = "";
            let totalSum = 0;
            cart.forEach((item, index) => {
                itemsText += `${index + 1}. ${item.name} - ${item.price} руб.\n`;
                totalSum += item.price;
            });

            var textForAdmin = `🔥 Новый заказ (Опт)!\n\n${itemsText}\n💰 Итого: ${totalSum} руб.\n🚇 Метро: ${metroStation}\n👤 Клиент: ${clientName}\nID: ${clientId}`;
            var urlAdmin = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + adminId + "&text=" + encodeURIComponent(textForAdmin);
            fetch(urlAdmin);
            
            if (user && user.id) {
                var textForClient = `✅ Спасибо за заказ!\nВы выбрали:\n${itemsText}\nИтого: ${totalSum} руб.\n🚇 Станция метро: ${metroStation}\nОжидайте сообщения от менеджера.`;
                var urlClient = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + user.id + "&text=" + encodeURIComponent(textForClient);
                fetch(urlClient);
            }
            
            alert("Заказ оформлен!");
            cart = [];
            updateCheckoutBtn();
        }

        // Запускаем отрисовку при загрузке страницы
        renderProducts();
    </script>
</body>
</html>
