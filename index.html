<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; background: #667eea; color: white; padding: 20px; }
        .card { background: rgba(255,255,255,0.2); padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        button { background: red; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; font-size: 16px; }
    </style>
</head>
<body>
    <h2>Магазин</h2>
    
    <div class="card">
        <h3>Футболка</h3>
        <p>1500 руб.</p>
        <button onclick="sendOrder('Футболка', 1500)">КУПИТЬ</button>
    </div>

    <div class="card">
        <h3>Кружка</h3>
        <p>800 руб.</p>
        <button onclick="sendOrder('Кружка', 800)">КУПИТЬ</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        function sendOrder(item, price) {
            var token = "8270338103:AAFx1KSB85vrwTyACfbIonpTHa4h0pXn-FA";
            var adminId = "5569005187";
            
            // 1. Отправляем заказ тебе
            var textForAdmin = "Заказ: " + item + " за " + price + " руб.";
            var urlAdmin = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + adminId + "&text=" + encodeURIComponent(textForAdmin);
            fetch(urlAdmin);
            
            // 2. Пытаемся отправить клиенту (если он в Telegram)
            var user = window.Telegram.WebApp.initDataUnsafe.user;
            if (user && user.id) {
                var clientId = user.id;
                var textForClient = "Спасибо! Вы купили " + item + ".";
                var urlClient = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + clientId + "&text=" + encodeURIComponent(textForClient);
                fetch(urlClient);
            }
            
            alert("Заказ отправлен!");
        }
    </script>
</body>
</html>
