        function changeTab(tab, e) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            renderBrands(); // Перерисовываем бренды (цены обновятся)
        }

        // Отрисовка списка брендов (главный экран)
        function renderBrands() {
            const list = document.getElementById('brands-list');

            for (let brand in DATABASE) {
                const count = DATABASE[brand].length;
                const div = document.createElement('div');
                div.className = 'brand-btn';
                div.innerHTML = `
                    <span>${brand}</span>
                    <span class="brand-count">${count} вкусов</span>
                `;
                div.onclick = () => openBrand(brand);
                list.appendChild(div);
            }
        }

                container.appendChild(label);
            });

            // Если корзина не пуста, показываем кнопку заказа
            if (cart.length > 0) document.getElementById('checkout-btn').style.display = 'block';
        }

        function goBack() {
            document.getElementById('flavors-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            updateUI(); // Обновляем кнопку заказа
        }

        function addSelectedToCart() {
            const checked = document.querySelectorAll('.flavor-check:checked');
            if (checked.length === 0) {
                alert("Выберите хотя бы один вкус!");
                return;
            }

            checked.forEach(cb => {
                // Берем цену из текущей активной вкладки опта
                cart.push({ brand: currentBrand, flavor: cb.value, price: PRICES[currentTab] });
                cb.checked = false;
            });

            alert(`✅ Добавлено в корзину!`);
            updateUI(); // Обновляем корзину и кнопку
        }

        function removeItem(index) {
            cart.splice(index, 1); 
            updateUI();
        }

        function clearCart() {
            if(confirm("Очистить всю корзину?")) {
                cart = [];
                updateUI();
            }
        }

        function updateUI() {
            const btn = document.getElementById('checkout-btn');
            const cartSection = document.getElementById('cart-section');
            const cartList = document.getElementById('cart-list');

            if (cart.length > 0) {
                let total = cart.reduce((sum, item) => sum + item.price, 0);
                btn.style.display = 'block';
                btn.innerText = `🛒 Оформить (${cart.length} шт.) на ${total} руб.`;

                cartSection.style.display = 'block';
                cartList.innerHTML = ''; 

                // Группируем для вывода
                const grouped = {};
                cart.forEach(i => { 
                    const key = `${i.brand} - ${i.flavor}`;
                    grouped[key] = (grouped[key] || 0) + 1;
                });

                let index = 0;
                for (let key in grouped) {
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <span>${key} (x${grouped[key]})</span>
                        <button class="delete-btn" onclick="removeItem(${index})">❌</button>
                    `;
                    cartList.appendChild(div);
                    index++;
                }
            } else {
                btn.style.display = 'none';
                cartSection.style.display = 'none';
            }
        }

        function toggleMetro() {
            if (cart.length === 0) { alert("Корзина пуста!"); return; }
            document.getElementById('metro-section').style.display = 'block';
            document.getElementById('checkout-btn').innerText = "✅ Подтвердить заказ";
            document.getElementById('checkout-btn').onclick = submitOrder;
            window.scrollTo(0, document.body.scrollHeight);
        }
