<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ТЕМНАЯ ТЕМА (Вейп-Шоп) */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f0f13; 
            color: #e0e0e0; 
            padding: 15px; 
            padding-bottom: 120px; 
            margin: 0; 
        }
        
        h2 { text-align: center; color: #b366ff; text-shadow: 0 0 10px rgba(179, 102, 255, 0.5); margin-bottom: 20px; font-weight: 800; letter-spacing: 1px; }
        
        /* Вкладки */
        .tabs { display: flex; gap: 8px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { 
            flex: 1; background: #1c1c24; color: #888; padding: 12px; border: 1px solid #333; 
            border-radius: 8px; font-size: 14px; white-space: nowrap; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { 
            background: #b366ff; color: #fff; border-color: #b366ff; 
            box-shadow: 0 0 15px rgba(179, 102, 255, 0.4); font-weight: bold;
        }
        
        /* Карточки */
        .card { 
            background: #1c1c24; padding: 20px; margin-bottom: 20px; 
            border-radius: 12px; border: 1px solid #2a2a35;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h3 { margin-top: 0; margin-bottom: 5px; font-size: 20px; color: #fff; }
        p { margin-top: 0; margin-bottom: 15px; font-weight: bold; color: #00ffff; font-size: 15px; }
        
        /* Сетка вкусов */
        .flavors-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .flavors-grid::-webkit-scrollbar { width: 6px; }
        .flavors-grid::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        
        .flavor-checkbox { 
            display: flex; align-items: center; background: #252530; padding: 10px; 
            border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;
        }
        .flavor-checkbox:hover { border-color: #b366ff; }
        .flavor-checkbox input { margin-right: 10px; transform: scale(1.3); cursor: pointer; accent-color: #b366ff; }
        
        /* Выпадающий список для картриджей */
        .cartridge-select {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; 
            background: #252530; color: #fff; border: 1px solid #444; font-size: 15px;
        }
        
        /* Кнопки */
        button { 
            background: linear-gradient(90deg, #b366ff, #7a33cc); color: white; padding: 14px; 
            border: none; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(179, 102, 255, 0.2);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(179, 102, 255, 0.4); }
        
        /* Блок КОРЗИНЫ */
        #cart-section { display: none; background: #1c1c24; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2a35; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333; font-size: 14px; }
        .cart-item:last-child { border-bottom: none; }
        .delete-btn { background: #e74c3c; color: white; border: none; border-radius: 5px; padding: 5px 10px; font-size: 12px; width: auto; cursor: pointer; box-shadow: none; }
        .delete-btn:hover { background: #c0392b; transform: none; box-shadow: none; }
        .clear-cart-btn { background: #444; color: #fff; margin-top: 10px; padding: 10px; font-size: 14px; }
        
        /* Главная кнопка заказа */
        #checkout-btn {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #00ffff;
            color: #000; padding: 20px; font-size: 18px; border: none;
            display: none; font-weight: bold; text-align: center; box-sizing: border-box; z-index: 100;
            cursor: pointer; box-shadow: 0 -4px 15px rgba(0, 255, 255, 0.3);
        }
        
        /* Блок выбора метро */
        #metro-section { display: none; background: #1c1c24; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2a2a35; }
        .line-btn { padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; margin-bottom: 8px; width: 100%; cursor: pointer; transition: 0.2s; }
        .line-btn:hover { opacity: 0.9; }
        
        .red { background: #e74c3c; }
        .blue { background: #3498db; }
        .green { background: #2ecc71; }
        
        #stations-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .station-btn { 
            background: #252530; color: #ccc; border: 1px solid #444; font-size: 13px; padding: 10px; 
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .station-btn.selected { 
            background: #b366ff; color: #fff; font-weight: bold; border-color: #b366ff; 
            box-shadow: 0 0 10px rgba(179, 102, 255, 0.5);
        }
    </style>
</head>
<body>
    <h2>VAPE SHOP</h2>

    <!-- Кнопка админа (будет видна только тебе) -->
    <div id="admin-panel-btn" style="display: none; text-align: center; margin-bottom: 15px;">
        <button onclick="openAdminPanel()" style="background: #333; color: #fff; padding: 8px 15px; font-size: 14px; width: auto; border: 1px solid #555;">⚙️ Управление наличием</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="changeTab('10', event)">от 10 шт</button>
        <button class="tab-btn" onclick="changeTab('30', event)">от 30 шт</button>
        <button class="tab-btn" onclick="changeTab('50', event)">от 50 шт</button>
        <button class="tab-btn" onclick="changeTab('100', event)">от 100 шт</button>
    </div>

    <div id="product-container"></div>

    <!-- Окно настроек админа -->
    <div id="admin-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto;">
        <h3 style="color: #b366ff; margin-top: 0;">⚙️ Наличие товаров</h3>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">Сними галочки с тех вкусов, которых НЕТ в наличии. Клиенты их не увидят.</p>
        
        <div id="admin-flavors-list" style="margin-bottom: 20px;"></div>
        
        <button onclick="saveAdminSettings()" style="background: #28a745; margin-bottom: 10px;">✅ Сохранить</button>
        <button onclick="closeAdminPanel()" style="background: #555;">Отмена</button>
    </div>

    <!-- БЛОК КОРЗИНЫ -->
    <div id="cart-section">
        <h3 style="color: #00ffff; font-size: 16px; margin-bottom: 10px;">🛒 Ваша корзина:</h3>
        <div id="cart-list"></div>
        <button class="clear-cart-btn" onclick="clearCart()">🗑 Очистить всё</button>
    </div>

    <!-- Блок выбора метро -->
    <div id="metro-section">
        <h3 style="margin-top: 0; color: #fff;">🚇 Выберите ветку:</h3>
        <button class="line-btn red" onclick="showLine('red')">🔴 Красная ветка</button>
        <button class="line-btn blue" onclick="showLine('blue')">🔵 Синяя ветка</button>
        <button class="line-btn green" onclick="showLine('green')">🟢 Зеленая ветка</button>
        
        <div id="stations-list"></div>
    </div>

    <button id="checkout-btn" onclick="toggleMetro()">🛒 Оформить заказ</button>

    <script>
        window.Telegram.WebApp.ready();
        
        let cart = [];
        let currentTab = '10';
        let selectedStation = "";
        
        const PRICES = { '10': 15, '30': 14, '50': 13, '100': 12 };

        // Твой ID (для админки)
        const ADMIN_ID = 5569005187; 
        
        // Загружаем сохраненные остатки из памяти
        let inStock = JSON.parse(localStorage.getItem('vape_stock')) || {};

        // Показываем кнопку админа только тебе
        const user = window.Telegram.WebApp.initDataUnsafe?.user;
        if (user && user.id === ADMIN_ID) {
            document.getElementById('admin-panel-btn').style.display = 'block';
        }

        // ИСПРАВЛЕННЫЕ СТАНЦИИ
        const lines = {
            blue: ["Малиновка", "Петровщина", "Михалово", "Грушевка", "Институт культуры", "Площадь Ленина", "Октябрьская", "Площадь Победы", "Площадь Якуба Коласа", "Академия наук", "Парк Челюскинцев", "Московская", "Восток", "Борисовский тракт", "Уручье"],
            red: ["Каменная Горка", "Кунцевщина", "Спортивная", "Пушкинская", "Молодёжная", "Фрунзенская", "Немига", "Купаловская", "Первомайская", "Пролетарская", "Тракторный завод", "Партизанская", "Автозаводская", "Могилёвская"],
            green: ["Слуцкий Гостинец", "Новаторская", "Вокзальная", "Ковальская Слобода", "Юбилейная площадь"]
        };

        const flavorsData = {
            catswill: { name: "🐱 Catswill", list: ["Яблоко", "Груша", "Клубника", "Персик", "Виноград", "Арбуз", "Дыня", "Манго", "Ананас", "Вишня", "Малина", "Черника", "Голубика", "Киви", "Маракуйя", "Гранат", "Лайм", "Банан", "Кокос", "Мята", "Ментол", "Мятный лимонад", "Мохито", "Кола", "Энергетик", "Табак", "Кофе", "Шоколад", "Карамель", "Ваниль", "Йогурт", "Крем-сода"] },
            monashka: { name: "👧 Монашка", list: ["Яблоко", "Груша", "Клубника", "Персик", "Виноград", "Арбуз", "Дыня", "Манго", "Ананас", "Вишня", "Малина", "Черника", "Голубика", "Киви", "Маракуйя", "Гранат", "Лайм", "Банан", "Кокос", "Лесные ягоды", "Чёрная смородина", "Красная смородина", "Крыжовник", "Брусника", "Ice Grape", "Ice Strawberry", "Ice Peach", "Ice Mango", "Ice Watermelon", "Ice Melon", "Ice Black Currant", "Ice Lime", "Ice Mojito", "Ice Cola", "Ice Energy", "Кислая вишня", "Кислое яблоко", "Кислый арбуз", "Кислый мармелад", "Голубая малина", "Мята", "Ментол", "Лимонады", "Мохито", "Кола", "Энергетик", "Табак", "Кофе", "Шоколад", "Карамель", "Ваниль", "Йогурт", "Крем-сода"] },
            podonki: { name: "🔹 Podonki", list: ["Яблоко (Apple)", "Груша (Pear)", "Клубника (Strawberry)", "Персик (Peach)", "Виноград (Grape)", "Арбуз (Watermelon)", "Дыня (Melon)", "Манго (Mango)", "Ананас (Pineapple)", "Вишня (Cherry)", "Лимон (Lemon)", "Апельсин (Orange)", "Малина (Raspberry)", "Черника (Blueberry)", "Банан (Banana)", "Кокос (Coconut)", "Мята (Mint)", "Ледяная мята (Ice Mint)", "Ментол (Menthol)", "Табак (Tobacco)", "Кофе (Coffee)", "Шоколад (Chocolate)", "Карамель (Caramel)", "Ваниль (Vanilla)", "Кислый мармелад (Sour Gummy)", "Кислая вишня (Sour Cherry)", "Кислое яблоко (Sour Apple)", "Кислый арбуз (Sour Watermelon)", "Ледяной виноград (Ice Grape)", "Ледяная клубника (Ice Strawberry)", "Ледяной персик (Ice Peach)", "Ледяной манго (Ice Mango)", "Ледяной ананас (Ice Pineapple)", "Ледяная дыня (Ice Melon)", "Ледяной арбуз (Ice Watermelon)", "Мятный лимонад (Mint Lemonade)", "Клубничный лимонад (Strawberry Lemonade)", "Малиновый лимонад (Raspberry Lemonade)", "Голубая малина (Blue Raspberry)", "Ежевика (Blackberry)", "Киви (Kiwi)", "Маракуйя (Passion Fruit)", "Гранат (Pomegranate)", "Лайм (Lime)", "Кола (Cola)", "Энергетик (Energy Drink)", "Йогурт (Yogurt)", "Крем-сода (Cream Soda)", "Мохито (Mojito)"] }
        };

        function changeTab(tab, e) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            render();
        }

        function render() {
            const box = document.getElementById('product-container');
            box.innerHTML = '';
            
            // 1. КАРТРИДЖИ
            box.innerHTML += `
                <div class="card" style="border: 1px solid #b366ff;">
                    <h3>💨 Картридж Xros</h3>
                    <p>Цена: 13 руб/шт</p>
                    <select id="xros-resistance" class="cartridge-select">
                        <option value="" disabled selected>--- Выберите сопротивление ---</option>
                        <option value="0.4 Ом">0.4 Ом</option>
                        <option value="0.6 Ом">0.6 Ом</option>
                        <option value="0.7 Ом">0.7 Ом</option>
                        <option value="0.8 Ом">0.8 Ом</option>
                    </select>
                    <button onclick="addCartridge()">➕ Добавить картридж</button>
                </div>
            `;

            // 2. ЖИЖИ (с фильтрацией по наличию)
            for (let key in flavorsData) {
                const brand = flavorsData[key];
                let checks = '';

                brand.list.forEach((f, i) => {
                    // Если товара нет в наличии и мы не админ — скрываем его
                    if (inStock[f] === false && (!user || user.id !== ADMIN_ID)) return;

                    checks += `
                        <label class="flavor-checkbox">
                            <input type="checkbox" value="${f}" data-brand="${key}">
                            ${f}
                        </label>
                    `;
                });

                if (checks === '') continue; // Если нет ни одного вкуса, скрываем карточку

                const brandImages = {
                    catswill: "https://tse3.mm.bing.net/th/id/OIP.TDPyRT8Tlu_Yv3XPVRr7QAHaHS?r=0&rs=1&pid=ImgDetMain&o=7&rm=3",
                    monashka: "https://tse4.mm.bing.net/th/id/OIP.7L7OunZ8Ibdp6PVmUg01hgHaGq?r=0&rs=1&pid=ImgDetMain&o=7&rm=3",
                    podonki: "https://kurgan.smokemarket.cc/image/cache/catalog/product/55ff22fa-cfb7-11ee-9b0b-309c23b36407/1c_55ff22facfb711ee9b0b309c23b36407_8bc4dcebcfd011ee9b0b309c23b36407-340x340.jpg?1708432189"
                };

                box.innerHTML += `
                    <div class="card">
                        <div style="display: flex; align-items: center; margin-bottom: 10px;">
                            <img src="${brandImages[key]}" style="width: 50px; height: 50px; border-radius: 8px; margin-right: 15px; object-fit: cover;" alt="${brand.name}">
                            <div>
                                <h3 style="margin: 0;">${brand.name}</h3>
                                <p style="margin: 0;">Цена: ${PRICES[currentTab]} руб/шт</p>
                            </div>
                        </div>
                        <div class="flavors-grid">${checks}</div>
                        <button onclick="addBrandToCart('${key}')">➕ Добавить выбранные</button>
                    </div>
                `;
            }
        }

        function addCartridge() {
            const select = document.getElementById('xros-resistance');
            if (!select.value) {
                alert("⚠️ Выберите сопротивление картриджа!");
                return;
            }
            cart.push({ brand: "💨 Картридж Xros", flavor: select.value });
            select.value = ""; 
            updateUI();
            alert("Картридж добавлен в корзину!");
        }

        function addBrandToCart(brandKey) {
            const checkboxes = document.querySelectorAll(`input[data-brand="${brandKey}"]:checked`);
            if (checkboxes.length === 0) {
                alert("Выберите хотя бы один вкус!");
                return;
            }
            checkboxes.forEach(cb => {
                cart.push({ brand: flavorsData[brandKey].name, flavor: cb.value });
                cb.checked = false;
            });
            updateUI();
            alert("Добавлено!");
        }

        function removeItem(index) {
            cart.splice(index, 1); 
            updateUI();
        }

        function clearCart() {
            if(confirm("Вы уверены, что хотите очистить всю корзину?")) {
                cart = [];
                updateUI();
            }
        }

        function updateUI() {
            const btn = document.getElementById('checkout-btn');
            const cartSection = document.getElementById('cart-section');
            const cartList = document.getElementById('cart-list');

            if (cart.length > 0) {
                let price = 15;
                if (cart.length >= 100) price = 11;
                else if (cart.length >= 50) price = 12;
                else if (cart.length >= 30) price = 13;
                else if (cart.length >= 10) price = 14;

                let total = cart.length * price;

                btn.style.display = 'block';
                btn.innerText = `🛒 Оформить (${cart.length} шт.) на ${total} руб.`;

                cartSection.style.display = 'block';
                cartList.innerHTML = ''; 

                cart.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <span>${item.brand} - ${item.flavor}</span>
                        <button class="delete-btn" onclick="removeItem(${index})">❌</button>
                    `;
                    cartList.appendChild(div);
                });

            } else {
                btn.style.display = 'none';
                cartSection.style.display = 'none';
            }
        }

        function toggleMetro() {
            if (cart.length === 0) {
                alert("Ваша корзина пуста. Добавьте товары!");
                return;
            }
            
            const sec = document.getElementById('metro-section');
            if (sec.style.display === 'none' || sec.style.display === '') {
                sec.style.display = 'block';
                document.getElementById('checkout-btn').innerText = "✅ Подтвердить заказ";
                document.getElementById('checkout-btn').onclick = submitOrder;
                window.scrollTo(0, document.body.scrollHeight);
            }
        }

        function showLine(line) {
            const list = document.getElementById('stations-list');
            list.innerHTML = '';
            lines[line].forEach(st => {
                const btn = document.createElement('button');
                btn.className = 'station-btn';
                btn.innerText = st;
                btn.onclick = () => {
                    document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedStation = st;
                };
                list.appendChild(btn);
            });
        }

        function submitOrder() {
            if (!selectedStation) {
                alert("⚠️ Выберите станцию метро!");
                return;
            }

            const token = "8270338103:AAFx1KSB85vrwTyACfbIonpTHa4h0pXn-FA";
            const adminId = "5569005187";
            
            let price = 15;
            if (cart.length >= 100) price = 11;
            else if (cart.length >= 50) price = 12;
            else if (cart.length >= 30) price = 13;
            else if (cart.length >= 10) price = 14;
            let total = cart.length * price;

            let items = {};
            cart.forEach(i => { let k = `${i.brand} [${i.flavor}]`; items[k] = (items[k] || 0) + 1; });
            let text = "";
            for (let k in items) text += `${k} - ${items[k]} шт.\n`;

            let msgAdmin = `🔥 Заказ!\n${text}\nИтого: ${total} руб.\n🚇 ${selectedStation}\nКлиент: @${user?.username || user?.first_name}\nID: ${user?.id}`;
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${adminId}&text=${encodeURIComponent(msgAdmin)}`);

            if (user?.id) {
                let msgClient = `✅ Спасибо! Вы заказали:\n${text}\nИтого: ${total} руб.\n🚇 ${selectedStation}`;
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${user.id}&text=${encodeURIComponent(msgClient)}`);
            }

            alert("Заказ отправлен!");
            location.reload();
        }

        // === ЛОГИКА АДМИН-ПАНЕЛИ ===
        function openAdminPanel() {
            const list = document.getElementById('admin-flavors-list');
            list.innerHTML = '';

            for (let key in flavorsData) {
                const brand = flavorsData[key];
                let html = `<h4 style="color: #00ffff; margin-bottom: 5px; margin-top: 15px;">${brand.name}</h4>`;
                
                brand.list.forEach(f => {
                    let isChecked = inStock[f] !== false ? 'checked' : '';
                    html += `
                        <label style="display: block; margin-bottom: 5px; font-size: 14px; cursor: pointer;">
                            <input type="checkbox" data-flavor="${f}" ${isChecked} style="transform: scale(1.2); margin-right: 10px; cursor: pointer;"> 
                            ${f}
                        </label>
                    `;
                });
                list.innerHTML += `<div style="margin-bottom: 15px; background: #252530; padding: 10px; border-radius: 8px; text-align: left;">${html}</div>`;
            }

            document.getElementById('admin-modal').style.display = 'block';
        }

        function closeAdminPanel() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        function saveAdminSettings() {
            const checkboxes = document.querySelectorAll('#admin-flavors-list input[type="checkbox"]');
            let newStock = {};

            checkboxes.forEach(cb => {
                newStock[cb.getAttribute('data-flavor')] = cb.checked;
            });

            localStorage.setItem('vape_stock', JSON.stringify(newStock));
            inStock = newStock;

            alert("✅ Настройки наличия сохранены!");
            closeAdminPanel();
            render();
        }

        render();
    </script>
</body>
</html>
