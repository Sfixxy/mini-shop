<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="data.js"></script>
    <style>
        body { font-family: Arial; background: #0f0f13; color: white; padding: 20px; }
        button { display: block; width: 100%; padding: 15px; margin-bottom: 10px; background: #b366ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>VAPE SHOP</h2>
    
    <div id="menu">
        <button onclick="showCat('liquids')">💨 Жидкости</button>
        <button onclick="showCat('pods')">📱 Поды</button>
        <button onclick="showCat('coils')">⚙️ Картриджи</button>
        <button onclick="showCat('snus')">🍬 Снюс</button>
    </div>

    <div id="brands" style="display: none;">
        <button onclick="goBack()">← Назад</button>
        <div id="brands-list"></div>
    </div>

    <div id="flavors" style="display: none;">
        <button onclick="goToBrands()">← Назад к брендам</button>
        <h3 id="flavors-title"></h3>
        <div id="flavors-list"></div>
    </div>

    <script>
        let currentCategory = "";
        let currentBrand = "";

        function showCat(cat) {
            currentCategory = cat;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('brands').style.display = 'block';
            
            const list = document.getElementById('brands-list');
            list.innerHTML = '';
            
            for (let brand in DB[cat]) {
                const btn = document.createElement('button');
                btn.innerText = brand;
                btn.onclick = () => showFlavors(brand);
                list.appendChild(btn);
            }
        }

        function goBack() {
            document.getElementById('brands').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
        }

        function showFlavors(brand) {
            currentBrand = brand;
            document.getElementById('brands').style.display = 'none';
            document.getElementById('flavors').style.display = 'block';
            document.getElementById('flavors-title').innerText = brand;
            
            const list = document.getElementById('flavors-list');
            list.innerHTML = '';
            
            DB[currentCategory][brand].forEach(f => {
                const div = document.createElement('div');
                div.style.padding = '10px';
                div.style.background = '#1c1c24';
                div.style.marginBottom = '5px';
                div.innerText = f;
                list.appendChild(div);
            });
        }

        function goToBrands() {
            document.getElementById('flavors').style.display = 'none';
            document.getElementById('brands').style.display = 'block';
        }
    </script>
</body>
</html>
