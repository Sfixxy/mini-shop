<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f13; color: #e0e0e0; padding: 15px; padding-bottom: 100px; margin: 0; }
        h2 { text-align: center; color: #b366ff; margin-bottom: 20px; font-weight: 800; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { flex: 1; background: #1c1c24; color: #888; padding: 12px; border: 1px solid #333; border-radius: 8px; font-size: 14px; white-space: nowrap; cursor: pointer; }
        .tab-btn.active { background: #b366ff; color: #fff; border-color: #b366ff; font-weight: bold; }

        /* Главные категории */
        .category-btn { 
            background: #252530; padding: 25px; margin-bottom: 15px; border-radius: 12px; 
            border: 1px solid #333; cursor: pointer; text-align: center; font-size: 18px; font-weight: bold; 
            transition: 0.2s; display: block; width: 100%; color: #fff;
        }
        .category-btn:hover { border-color: #b366ff; background: #2a2a35; }
        
        /* Кнопки брендов */
        .brand-btn { 
            display: flex; justify-content: space-between; align-items: center;
            background: #1c1c24; padding: 15px; margin-bottom: 10px; border-radius: 10px; 
            border: 1px solid #2a2a35; cursor: pointer; font-size: 16px; font-weight: bold;
        }
        .brand-btn:hover { border-color: #b366ff; }
        .brand-count { font-size: 12px; color: #888; background: #0f0f13; padding: 3px 8px; border-radius: 10px; }

        /* Экран с вкусами */
        .back-btn { background: #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; border: none; font-weight: bold; width: 100%; }
        .flavors-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; }
        .flavor-checkbox { display: flex; align-items: center; background: #252530; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .flavor-checkbox input { margin-right: 10px; transform: scale(1.2); cursor: pointer; }

        button.action-btn { background: linear-gradient(90deg, #b366ff, #7a33cc); color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        #checkout-btn { position: fixed; bottom: 0; left: 0; width: 100%; background: #00ffff; color: #000; padding: 20px; font-size: 18px; border: none; display: none; font-weight: bold; text-align: center; z-index: 100; }
        
        #cart-section { display: none; background: #1c1c24; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2a35; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 13px; }
        .delete-btn { background: #e74c3c; color: white; border: none; border-radius: 5px; padding: 5px 8px; cursor: pointer; }
        
        #metro-section { display: none; background: #1c1c24; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .line-btn { padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; margin-bottom: 8px; width: 100%; cursor: pointer; }
        .red { background: #e74c3c; } .blue { background: #3498db; } .green { background: #2ecc71; }
        #stations-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .station-btn { background: #252530; color: #ccc; border: 1px solid #444; font-size: 13px; padding: 10px; border-radius: 6px; cursor: pointer; }
        .station-btn.selected { background: #b366ff; color: #fff; border-color: #b366ff; }
    </style>
</head>
<body>
    <h2>VAPE SHOP</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="changeTab('10', event)">от 10 шт</button>
        <button class="tab-btn" onclick="changeTab('30', event)">от 30 шт</button>
        <button class="tab-btn" onclick="changeTab('50', event)">от 50 шт</button>
        <button class="tab-btn" onclick="changeTab('100', event)">от 100 шт</button>
    </div>

    <!-- ЭКРАН 1: ГЛАВНЫЕ КАТЕГОРИИ -->
    <div id="screen-categories">
        <button class="category-btn" onclick="openCategory('liquids')">💨 Жидкости</button>
        <button class="category-btn" onclick="openCategory('pods')">📱 Поды (Одноразки)</button>
        <button class="category-btn" onclick="openCategory('coils')">⚙️ Картриджи и Испарители</button>
        <button class="category-btn" onclick="openCategory('snus')">🍬 Снюс и Никобустеры</button>
    </div>

    <!-- ЭКРАН 2: СПИСОК БРЕНДОВ -->
    <div id="screen-brands" style="display: none;">
        <button class="back-btn" onclick="goToCategories()">← Назад в категории</button>
        <div id="brands-list"></div>
    </div>

    <!-- ЭКРАН 3: СПИСОК ВКУСОВ -->
    <div id="screen-flavors" style="display: none;">
        <button class="back-btn" onclick="goToBrands()">← Назад к брендам</button>
        <h3 id="flavors-title" style="margin-top:0;"></h3>
        <div class="flavors-grid" id="flavors-container"></div>
        <button class="action-btn" onclick="addSelectedToCart()">➕ Добавить выбранные</button>
    </div>

    <!-- КОРЗИНА -->
    <div id="cart-section">
        <h3 style="color: #00ffff; font-size: 16px;">🛒 Ваша корзина:</h3>
        <div id="cart-list"></div>
        <button onclick="clearCart()" style="background:#444; color:#fff; margin-top:10px; padding:10px; width:100%; border:none; border-radius:5px;">🗑 Очистить всё</button>
    </div>

    <!-- МЕТРО -->
    <div id="metro-section">
        <h3 style="margin-top: 0; color: #fff;">🚇 Выберите ветку:</h3>
        <button class="line-btn red" onclick="showLine('red')">🔴 Красная</button>
        <button class="line-btn blue" onclick="showLine('blue')">🔵 Синяя</button>
        <button class="line-btn green" onclick="showLine('green')">🟢 Зеленая</button>
        <div id="stations-list"></div>
    </div>

    <button id="checkout-btn" onclick="toggleMetro()">🛒 Оформить заказ</button>

    <script>
        window.Telegram.WebApp.ready();
        const user = window.Telegram.WebApp.initDataUnsafe?.user;
        const TOKEN = "8270338103:AAFx1KSB85vrwTyACfbIonpTHa4h0pXn-FA";

        let cart = [];
        let currentTab = '10';
        let selectedStation = "";
        
        let currentCategory = "";
        let currentBrand = "";

        // =====================================================================
        // БАЗА ДАННЫХ. СЮДА ВСТАВЛЯЙ СВОИ ТОВАРЫ.
        // Я уже раскидал бренды по категориям, тебе осталось добавить вкусы.
        // =====================================================================
        const DB = {
            liquids: {
                "Catswill": ["Манго", "Клубника", "Арбуз", "Ледяной виноград", "Дыня"],
                "Husky": ["Мятная жвачка", "Ледяная маракуйя", "Ледяная фанта", "Ледяной персик"],
                "Podonki": ["Кислый мармелад", "Кислая вишня", "Ледяной виноград", "Мятный лимонад"],
                "Chrome": ["Манго Ананас", "Баблгамм", "Кактусовая груша"],
                "Foggy": ["Лимончелло", "Парфе", "Пудинг"],
                "MAD 60": ["Яблоко Маракуйя", "Бабл Гам", "Вишня Кола"],
                "Jackpot": ["Кислая вишня", "Черри манго", "Малина"],
                "Professor": ["Капучино", "Черри лайм", "Манго кофе"],
                "Wednesday": ["Мятный лед", "Кола лед", "Манго лед"],
                "Skala": ["Яблоко ежевика", "Тархун", "Кислый мохито"],
                "Bushido": ["Арбуз лайм", "Зеленое яблоко", "Ледяное киви"],
                "Bjorn": ["Ананас манго", "Вишневая кола", "Ледяная клубника"]
                // Добавляй сюда остальные бренды по аналогии: "Название": ["Вкус 1", "Вкус 2"]
            },
            pods: {
                "Maxflay 30000": ["Апельсин лимон", "Капучино", "Лимон лайм"],
                "Bjorn Tron": ["Ананас киви", "Вишневая кола", "Яблоко со льдом"],
                "ElfBar": ["Полярная мята", "Горная мята", "Сосновая хвоя"],
                "Lost Mary": ["Виноград", "Кола", "Мята"],
                "Vozol Vista": ["Сочный персик", "Мята", "Клубника банан"]
            },
            coils: {
                "Vaporesso Xros": ["Картридж 0.4 Ом", "Картридж 0.6 Ом", "Картридж 0.8 Ом"],
                "GeekVape": ["Испаритель B0.3", "Испаритель B0.4"],
                "Smoant": ["Испаритель 0.4", "Испаритель 0.6", "Испаритель 0.3"]
            },
            snus: {
                "ICEBERG": ["Strong 75mg", "Ultra 150mg", "Hot Ace 120mg"],
                "Faff": ["Spearmint 65mg"],
                "Zuzu": ["Kiwi Burn 150mg", "Pinkman 150mg"],
                "Glitch": ["Double Mint 200mg", "Ice Lemon 200mg"]
            }
        };

        function changeTab(tab, e) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
        }

        // --- НАВИГАЦИЯ ---
        function openCategory(cat) {
            currentCategory = cat;
            document.getElementById('screen-categories').style.display = 'none';
            document.getElementById('screen-brands').style.display = 'block';
            renderBrands();
        }

        function goToCategories() {
            document.getElementById('screen-brands').style.display = 'none';
            document.getElementById('screen-categories').style.display = 'block';
        }

        function renderBrands() {
            const list = document.getElementById('brands-list');
            list.innerHTML = '';
            
            const brands = DB[currentCategory] || {};
            for (let brand in brands) {
                const count = brands[brand].length;
                const div = document.createElement('div');
                div.className = 'brand-btn';
                div.innerHTML = `<span>${brand}</span><span class="brand-count">${count} шт</span>`;
                div.onclick = () => openBrand(brand);
                list.appendChild(div);
            }
        }

        function openBrand(brand) {
            currentBrand = brand;
            document.getElementById('screen-brands').style.display = 'none';
            document.getElementById('screen-flavors').style.display = 'block';
            document.getElementById('flavors-title').innerText = brand;
            
            const container = document.getElementById('flavors-container');
            container.innerHTML = '';

            DB[currentCategory][brand].forEach(f => {
                const label = document.createElement('label');
                label.className = 'flavor-checkbox';
                label.innerHTML = `<input type="checkbox" value="${f}" class="flavor-check"> ${f}`;
                container.appendChild(label);
            });
        }

        function goToBrands() {
            document.getElementById('screen-flavors').style.display = 'none';
            document.getElementById('screen-brands').style.display = 'block';
        }

        // --- КОРЗИНА ---
        function addSelectedToCart() {
            const checked = document.querySelectorAll('.flavor-check:checked');
            if (checked.length === 0) { alert("Выберите хотя бы один вкус!"); return; }

            checked.forEach(cb => {
                cart.push({ brand: currentBrand, flavor: cb.value });
                cb.checked = false;
            });

            alert(`✅ Добавлено!`);
            updateUI();
        }

        function removeItem(index) {
            cart.splice(index, 1); 
            updateUI();
        }

        function clearCart() {
            if(confirm("Очистить корзину?")) { cart = []; updateUI(); }
        }

        function updateUI() {
            const btn = document.getElementById('checkout-btn');
            const cartSection = document.getElementById('cart-section');
            const cartList = document.getElementById('cart-list');

            if (cart.length > 0) {
                let price = 15;
                if (cart.length >= 100) price = 11;
                else if (cart.length >= 50) price = 12;
                else if (cart.length >= 30) price = 13;
                else if (cart.length >= 10) price = 14;
                
                let total = cart.length * price;

                btn.style.display = 'block';
                btn.innerText = `🛒 Оформить (${cart.length} шт.) на ${total} руб.`;

                cartSection.style.display = 'block';
                cartList.innerHTML = ''; 

                cart.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `<span>${item.brand} - ${item.flavor}</span><button class="delete-btn" onclick="removeItem(${index})">❌</button>`;
                    cartList.appendChild(div);
                });
            } else {
                btn.style.display = 'none';
                cartSection.style.display = 'none';
            }
        }

        // --- МЕТРО И ЗАКАЗ ---
        function toggleMetro() {
            if (cart.length === 0) { alert("Корзина пуста!"); return; }
            document.getElementById('metro-section').style.display = 'block';
            document.getElementById('checkout-btn').innerText = "✅ Подтвердить заказ";
            document.getElementById('checkout-btn').onclick = submitOrder;
            window.scrollTo(0, document.body.scrollHeight);
        }

        function showLine(line) {
            const list = document.getElementById('stations-list');
            list.innerHTML = '';
            const lines = {
                blue: ["Малиновка", "Петровщина", "Михалово", "Грушевка", "Институт культуры", "Площадь Ленина", "Октябрьская", "Площадь Победы", "Площадь Якуба Коласа", "Академия наук", "Парк Челюскинцев", "Московская", "Восток", "Борисовский тракт", "Уручье"],
                red: ["Каменная Горка", "Кунцевщина", "Спортивная", "Пушкинская", "Молодёжная", "Фрунзенская", "Немига", "Купаловская", "Первомайская", "Пролетарская", "Тракторный завод", "Партизанская", "Автозаводская", "Могилёвская"],
                green: ["Слуцкий Гостинец", "Новаторская", "Вокзальная", "Ковальская Слобода", "Юбилейная площадь"]
            };
            
            lines[line].forEach(st => {
                const btn = document.createElement('button');
                btn.className = 'station-btn';
                btn.innerText = st;
                btn.onclick = () => {
                    document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedStation = st;
                };
                list.appendChild(btn);
            });
        }

        function submitOrder() {
            if (!selectedStation) { alert("Выберите станцию метро!"); return; }

            let total = cart.length * 15; 
            let text = "";
            cart.forEach(i => text += `${i.brand} [${i.flavor}]\n`);

            let msg = `🔥 Заказ!\n${text}\nИтого: ${total} руб.\n🚇 ${selectedStation}\nКлиент: @${user?.username || user?.first_name}\nID: ${user?.id}`;
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=5569005187&text=${encodeURIComponent(msg)}`);

            alert("Заказ отправлен!");
            location.reload();
        }
    </script>
</body>
</html>
