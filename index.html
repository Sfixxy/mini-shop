<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Магазин</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Стили для всего сайта */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .shop-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .product-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .product-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
            background-color: #ddd; /* Заглушка, если картинка не загрузится */
        }
        
        .product-info {
            flex-grow: 1;
        }
        
        .product-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        
        .product-info p {
            margin: 0;
            font-weight: bold;
            color: #ffd700; /* Золотой цвет для цены */
        }
        
        button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="shop-header">
        <h1>🛍️ Мой Магазин</h1>
        <p>Выберите товар и нажмите «Купить»</p>
    </div>

    <!-- Сюда будут добавляться карточки товаров -->
    <div id="products-container"></div>

    <script>
        // 1. Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // === ВСТАВЬ СВОЙ АКТУАЛЬНЫЙ ТОКЕН СЮДА ===
        const TOKEN = "8270338103:AAFx1KSB85vrwTyACfbIonpTHa4h0pXn-FA"; 
        const CHAT_ID = "5569005187";

        // 2. Наш каталог товаров (можешь менять названия, цены и картинки)
        // Картинки я поставил случайные с сайта picsum, чтобы было красиво
        const products = [
            { id: 1, name: "Футболка 'Космос'", price: 1500, img: "https://picsum.photos/100/100?random=1" },
            { id: 2, name: "Кружка 'Код'", price: 800, img: "https://picsum.photos/100/100?random=2" },
            { id: 3, name: "Кепка 'Программист'", price: 1200, img: "https://picsum.photos/100/100?random=3" }
        ];

        // 3. Отрисовка карточек на странице
        const container = document.getElementById('products-container');
        
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.img}" alt="${product.name}" class="product-img">
                <div class="product-info">
                    <h3>${product.name}</h3>
                    <p>${product.price} ₽</p>
                </div>
                <button onclick="buyProduct('${product.name}', ${product.price})">Купить</button>
            `;
            container.appendChild(card);
        });

        // 4. Функция отправки заказа в Telegram
        import logging
from telegram import Update
from telegram.ext import ApplicationBuilder, CommandHandler, ContextTypes

logging.basicConfig(format='%(asctime)s - %(name)s - %(levelname)s - %(message)s', level=logging.INFO)

# Твой ID (чтобы бот знал, что команду даешь именно ты)
ADMIN_ID = 5569005187 

async def start(update: Update, context: ContextTypes.DEFAULT_TYPE):
    await update.message.reply_text("Бот запущен. Я готов принимать заказы и отвечать клиентам.")

# Команда для ответа клиенту: /reply ID_клиента Текст
async def reply_to_client(update: Update, context: ContextTypes.DEFAULT_TYPE):
    # Проверяем, что команду дал админ
    if update.effective_user.id != ADMIN_ID:
        return

    try:
        # Разбираем команду: /reply 123456 Привет
        args = context.args
        client_id = int(args[0])
        message_text = " ".join(args[1:])

        # Отправляем сообщение клиенту
        await context.bot.send_message(chat_id=client_id, text=message_text)
        await update.message.reply_text(f"✅ Сообщение отправлено клиенту {client_id}")

    except Exception as e:
        await update.message.reply_text(f"❌ Ошибка: {e}\nИспользуй формат: /reply ID Текст")

if __name__ == '__main__':
    TOKEN = "8270338103:AAFx1KSB85vrwTyACfbIonpTHa4h0pXn-FA"
    application = ApplicationBuilder().token(TOKEN).build()

    application.add_handler(CommandHandler("start", start))
    application.add_handler(CommandHandler("reply", reply_to_client)) # Ловим команду /reply

    print("Бот запущен...")
    application.run_polling()
    </script>
</body>
</html>
