<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f13; color: #e0e0e0; padding: 15px; padding-bottom: 100px; margin: 0; }
        h2 { text-align: center; color: #b366ff; margin-bottom: 20px; font-weight: 800; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { flex: 1; background: #1c1c24; color: #888; padding: 12px; border: 1px solid #333; border-radius: 8px; font-size: 14px; white-space: nowrap; cursor: pointer; }
        .tab-btn.active { background: #b366ff; color: #fff; border-color: #b366ff; font-weight: bold; }

        .category-btn { background: #252530; padding: 20px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; cursor: pointer; text-align: center; font-size: 18px; font-weight: bold; color: #fff; display: block; width: 100%; }
        .category-btn:hover { border-color: #b366ff; background: #2a2a35; }
        
        .brand-btn { display: flex; justify-content: space-between; align-items: center; background: #1c1c24; padding: 15px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #2a2a35; cursor: pointer; font-size: 16px; font-weight: bold; }
        .brand-btn:hover { border-color: #b366ff; }

        .back-btn { background: #333; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; border: none; font-weight: bold; width: 100%; }
        .flavors-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; }
        .flavor-checkbox { display: flex; align-items: center; background: #252530; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .flavor-checkbox input { margin-right: 10px; }

        button.action-btn { background: #b366ff; color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        #checkout-btn { position: fixed; bottom: 0; left: 0; width: 100%; background: #00ffff; color: #000; padding: 20px; font-size: 18px; border: none; display: none; font-weight: bold; text-align: center; z-index: 100; }
        
        #cart-section { display: none; background: #1c1c24; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2a35; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 13px; }
        .delete-btn { background: #e74c3c; color: white; border: none; border-radius: 5px; padding: 5px 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>VAPE SHOP</h2>

    <div class="tabs">
        <button class="tab-btn active">от 10 шт</button>
        <button class="tab-btn">от 30 шт</button>
        <button class="tab-btn">от 50 шт</button>
        <button class="tab-btn">от 100 шт</button>
    </div>

    <!-- ЭКРАН 1: КАТЕГОРИИ -->
    <div id="screen-categories">
        <button class="category-btn" onclick="openCategory('liquids')">💨 Жидкости</button>
        <button class="category-btn" onclick="openCategory('pods')">📱 Поды (Одноразки)</button>
        <button class="category-btn" onclick="openCategory('coils')">⚙️ Картриджи и Испарители</button>
        <button class="category-btn" onclick="openCategory('snus')">🍬 Снюс и Никобустеры</button>
    </div>

    <!-- ЭКРАН 2: БРЕНДЫ -->
    <div id="screen-brands" style="display: none;">
        <button class="back-btn" onclick="goToCategories()">← Назад</button>
        <div id="brands-list"></div>
    </div>

    <!-- ЭКРАН 3: ВКУСЫ -->
    <div id="screen-flavors" style="display: none;">
        <button class="back-btn" onclick="goToBrands()">← Назад</button>
        <h3 id="flavors-title"></h3>
        <div class="flavors-grid" id="flavors-container"></div>
        <button class="action-btn" onclick="addSelectedToCart()">➕ Добавить</button>
    </div>

    <div id="cart-section">
        <h3 style="color: #00ffff; font-size: 16px;">🛒 Корзина:</h3>
        <div id="cart-list"></div>
        <button onclick="clearCart()" style="background:#444; color:#fff; margin-top:10px; padding:10px; width:100%; border:none; border-radius:5px;">🗑 Очистить</button>
    </div>

    <button id="checkout-btn" onclick="alert('Тут будет метро и отправка!')">🛒 Оформить заказ</button>

    <script>
        // === БАЗА ДАННЫХ ===
        // Сюда ты будешь вставлять бренды. Пока тут 2 для теста.
               const DB = {
            liquids: {
                "CHROME BASIC": ["Манго Ананас 20мг"],
                "CHROME PINK": ["Баблгамм 20мг", "Кактусовая груша 20мг", "Клубничный пончик с молоком 20мг", "Кокос и ананас 20мг", "Розовая гуава 20мг"],
                "Foggy": ["Лимончелло 70мг", "Парфе 70мг", "Пудинг 70мг", "Темный смузи 70мг"],
                "Husky white 20мг": ["Cheam peak - Ледяная жвачка манго", "Cold passion - Ледяная маракуйя", "FANGERINE - Ледяная фанта с мандарином", "Pataya head - Ледяной ананасовый сок с лимоном", "Snow sorbet - Ледяное дынное мороженное", "Steep slope - Ледяной персик и клубничные конфеты", "Sweet vale - Ледяные конфеты с личи"],
                "MAD 60": ["Apple Passion Fruit - Яблоко Маракуйя", "Bubble Gum - Бабл Гам", "Candies - Конфеты", "Cherry Cola - Вишня Кола", "Cold Mango - Ледяной Манго", "Ice Lychee - Ледяной Личи", "Kiwi pineapple - Киви ананас", "Lime Grapes - Виноград Лайм", "Melon - Дыня", "Milkshake - Молочный коктейль", "Mix Tropic - Тропический Микс", "Orange Soda - Апельсиновая Содовая", "Paspberry Tea - Малиновый чай", "Peach Raspberry Lemonade - Персик Малина Лимонад"]
            },
            pods: {
                "Maxflay 30000": ["Апельсин лимон", "Капучино", "Лимон лайм", "Медовая дыня", "Молочный шоколад", "Перечная мята", "Смешанные ягоды"],
                "Bjorn tron": ["Ананас киви", "Вишневая кола", "Вишня клюква", "Вишня со льдом", "Грейпфрут клубника малина", "Классическая кола", "Клубника банан", "Клюква со льдом", "Клюква энергетик", "Малиновая газировка", "Черника малина", "Черника яблоко", "Чистый ментол", "Яблоко вишня", "Яблоко со льдом"]
            },
            coils: {
                "Vaporesso Xros": ["Картридж 0.4 Ом", "Картридж 0.6 Ом", "Картридж 0.8 Ом"],
                "GeekVape": ["Испаритель - Aegis B0,3Coil Om", "Испаритель - Aegis B0,4Coil Om"]
            },
            snus: {
                "ICEBERG": ["Strong 75mg", "Ultra 150mg", "Hot Ace 120mg"],
                "Faff": ["Spearmint 65mg"],
                "Zuzu": ["Kiwi Burn 150mg", "Pinkman 150mg"],
                "Glitch": ["Double Mint 200mg", "Ice Lemon 200mg"]
            }
        };
        let cart = [];
        let currentCategory = "";
        let currentBrand = "";

        // --- НАВИГАЦИЯ ---
        function openCategory(cat) {
            currentCategory = cat;
            document.getElementById('screen-categories').style.display = 'none';
            document.getElementById('screen-brands').style.display = 'block';
            
            const list = document.getElementById('brands-list');
            list.innerHTML = '';
            
            for (let brand in DB[cat]) {
                const div = document.createElement('div');
                div.className = 'brand-btn';
                div.innerHTML = `<span>${brand}</span>`;
                div.onclick = () => openBrand(brand);
                list.appendChild(div);
            }
        }

        function goToCategories() {
            document.getElementById('screen-brands').style.display = 'none';
            document.getElementById('screen-categories').style.display = 'block';
        }

        function openBrand(brand) {
            currentBrand = brand;
            document.getElementById('screen-brands').style.display = 'none';
            document.getElementById('screen-flavors').style.display = 'block';
            document.getElementById('flavors-title').innerText = brand;
            
            const container = document.getElementById('flavors-container');
            container.innerHTML = '';
            
            DB[currentCategory][brand].forEach(f => {
                const label = document.createElement('label');
                label.className = 'flavor-checkbox';
                label.innerHTML = `<input type="checkbox" value="${f}" class="flavor-check"> ${f}`;
                container.appendChild(label);
            });
        }

        function goToBrands() {
            document.getElementById('screen-flavors').style.display = 'none';
            document.getElementById('screen-brands').style.display = 'block';
        }

        // --- КОРЗИНА ---
        function addSelectedToCart() {
            const checked = document.querySelectorAll('.flavor-check:checked');
            if (checked.length === 0) { alert("Выбери вкус!"); return; }
            checked.forEach(cb => {
                cart.push({ brand: currentBrand, flavor: cb.value });
                cb.checked = false;
            });
            alert("Добавлено!");
            updateUI();
        }

        function updateUI() {
            const btn = document.getElementById('checkout-btn');
            const cartSection = document.getElementById('cart-section');
            const cartList = document.getElementById('cart-list');

            if (cart.length > 0) {
                btn.style.display = 'block';
                btn.innerText = `🛒 Оформить (${cart.length} шт.)`;
                cartSection.style.display = 'block';
                cartList.innerHTML = ''; 
                cart.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `<span>${item.brand} - ${item.flavor}</span><button class="delete-btn" onclick="removeItem(${index})">X</button>`;
                    cartList.appendChild(div);
                });
            } else {
                btn.style.display = 'none';
                cartSection.style.display = 'none';
            }
        }

        function removeItem(index) {
            cart.splice(index, 1); 
            updateUI();
        }

        function clearCart() {
            cart = []; 
            updateUI();
        }
    </script>
</body>
</html>
